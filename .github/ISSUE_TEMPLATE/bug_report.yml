name: Bug report
description: Report a playback or app problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe one problem per issue. Use a short, specific title that says
        what failed and where it happened.

        Do not include credentials, tokens, private playlist data, or unredacted
        diagnostic information.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I am using the latest release.
          required: true
        - label: I checked the README and relevant files in `docs/`.
          required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find this in the app settings or installed app details.
      placeholder: "v1.13.0"
    validations:
      required: true

  - type: input
    id: tv-model
    attributes:
      label: TV model
      placeholder: "Model shown in the TV information screen"
    validations:
      required: true

  - type: input
    id: webos-version
    attributes:
      label: webOS version
      placeholder: "Version shown in the TV information screen"
    validations:
      required: true

  - type: dropdown
    id: playlist-type
    attributes:
      label: Playlist type
      options:
        - M3U
        - Xtream
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead? Quote on-screen errors exactly.
      placeholder: Describe what you observed.
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: |
        Optional. Capture the TV with `./scripts/tv.sh capt screenshot screen.png`
        or `./scripts/tv.sh capt record screen.mp4`, then upload the result. Hide
        credentials and private information first.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm"

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - One channel
        - One group
        - All channels
        - VOD only
        - App navigation or settings
        - Other
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last working version
      description: Leave blank if the problem has always existed or is unknown.
      placeholder: "v1.12.0"

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce from a cold start
      description: Include every action needed to reproduce the problem.
      placeholder: |
        1. Cold-start the app.
        2. ...
        3. ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Generate the required diagnostic report

        A diagnostic report is required. Reproduce the bug while running the
        command below:

        ```bash
        ./scripts/tv.sh diag --attach --duration 15 --output tv-diag.json
        ```

        Review the report before submitting it. Do not use `--full`, and remove
        any credentials, tokens, URLs, or private playlist information.

  - type: textarea
    id: diagnostics
    attributes:
      label: tv-diag.json (required)
      description: |
        Drag the generated `tv-diag.json` file into this field, or paste its
        complete redacted JSON contents here.
      placeholder: Drag tv-diag.json here, or paste its redacted JSON contents.
    validations:
      required: true

  - type: textarea
    id: attempted-fixes
    attributes:
      label: What you tried
      description: Describe troubleshooting already attempted and its result.
      placeholder: Describe what you tried.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Relevant playlist entry or manifest (optional)

        Remove credentials, tokens, and private content first. For a wrong
        group, name, EPG match, or catchup problem, paste the single relevant
        and redacted `#EXTINF` entry:

        ```
        #EXTINF:-1 tvg-id="ch1" group-title="Group A",Channel 1
        http://host/a.m3u8
        ```

        For playback problems, the stream URL rarely helps because it normally
        contains credentials. Paste its redacted manifest instead:

        ```bash
        curl -s "<stream URL>" | head -40
        ```

  - type: textarea
    id: failing-entry
    attributes:
      label: Relevant playlist entry or manifest
      description: Optional. Paste only redacted content relevant to the issue.
      placeholder: Paste only redacted, relevant content.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed all submitted text and attachments for private data.
          required: true

  - type: markdown
    attributes:
      value: |
        ## After the issue is resolved

        Please post a comment explaining what fixed the problem, including if
        you resolved it yourself, and then close the issue.

        Other people may find this issue through search. Documenting the
        solution helps them; leaving without an update does not.
